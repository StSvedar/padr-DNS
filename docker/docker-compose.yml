networks:
  dns_net:
    ipam:
      config:
        - subnet: 10.53.0.0/16

services:
  root_ns:
    build:
      context: ../
      dockerfile: docker/Dockerfile.server
    command: ["python", "-m", "src.name_server.master.master_server"]
    env_file:
      - ../config/root.env
    networks:
      dns_net:
        ipv4_address: 10.53.0.100
    volumes:
      - ../zones:/app/zones

  root_slave:
    build:
      context: ../
      dockerfile: docker/Dockerfile.server
    command: ["python", "-m", "src.name_server.slave.slave_server"]
    env_file:
      - ../config/root_slave.env
    networks:
      dns_net:
        ipv4_address: 10.53.0.200
    depends_on:
      - root_ns

  tld_com_ns:
    build:
      context: ../
      dockerfile: docker/Dockerfile.server
    command: ["python", "-m", "src.name_server.master.master_server"]
    env_file:
      - ../config/tld_com.env
    networks:
      dns_net:
        ipv4_address: 10.53.0.101
    volumes:
      - ../zones:/app/zones

  auth_example_ns:
    build:
      context: ../
      dockerfile: docker/Dockerfile.server
    command: ["python", "-m", "src.name_server.master.master_server"]
    env_file:
      - ../config/auth_example.env
    networks:
      dns_net:
        ipv4_address: 10.53.0.102
    volumes:
      - ../zones:/app/zones
    ports:
      - "10055:53/udp"
      - "10055:53/tcp"

  resolver:
    build:
      context: ../
      dockerfile: docker/Dockerfile.server
    command: ["python", "-m", "src.recursive_resolver.server"]
    env_file:
      - ../config/resolver.env
    networks:
      dns_net:
        ipv4_address: 10.53.0.10
    ports:
      - "10054:53/udp"
      - "10054:53/tcp"
    depends_on:
      - root_ns
      - root_slave
      - tld_com_ns
      - auth_example_ns